<!-- fragments.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
  <meta charset="UTF-8">
  <title>BookTrackr</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<header th:fragment="header">
  <div class="text-white py-3 text-center">
    <h1>📚 BookTrackr</h1>
    <nav class="mt-2">
      <!-- If user is logged in -->
      <div sec:authorize="isAuthenticated()">
        <a th:href="@{/home}" class="text-white mx-2">Home</a>
        <a th:href="@{/stock}" class="text-white mx-2">Stock</a>
        <a th:href="@{/logout}" class="text-white mx-2">Logout</a>
      </div>

      <!-- If user is NOT logged in -->
      <div sec:authorize="isAnonymous()">
        <a th:href="@{/}" class="text-white mx-2">Login</a>
        <a th:href="@{/signup}" class="text-white mx-2">New User</a>
      </div>
    </nav>
  </div>

  <div class="position-absolute top-0 end-0 p-3 text-end">
    <span sec:authorize="isAuthenticated()">
      👤 <b th:text="${#authentication.name}"></b>
    </span>
    <span sec:authorize="isAnonymous()">
      ⚠️ <b>Not Logged In</b>
    </span>
  </div>
</header>
</body>
</html>
