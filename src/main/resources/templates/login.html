<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head">
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body class="login-bg">
<header th:replace="fragments :: header"></header>
<div style="position: absolute; top: 250px; left: 500px;">
  <div class="card p-4 shadow-sm" style="min-width: 300px;">
    <h3 class="text-center mb-4">Login</h3>
    <form th:action="@{/login}" method="post">
      <div class="mb-3">
        <label for="username" class="form-label" style="font-size: 18px;">Username</label>
        <input type="text" name="username" class="form-control" id="username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label" style="font-size: 18px;">Password</label>
        <input type="password" name="password" class="form-control" id="password" required>
      </div>
      <button style="background-color: #4409b8" type="submit" class="btn btn-primary w-100">Log In</button>
    </form>
  </div>
</div>
</body>
</html>
